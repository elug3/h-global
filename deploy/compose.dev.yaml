# Local development: PostgreSQL 18 and hg-server.
#   docker compose -f deploy/compose.dev.yaml up --build
# Studio API: http://localhost:8080/studio-api  (owner@hglobal.test / owner-password)
# Storefront API: http://localhost:8080/api
# Storefront: run `npm run dev` in storefront/ (http://localhost:3000, forwards /api to :8080).
name: hglobal-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: hglobal
      POSTGRES_PASSWORD: hglobal_dev
      POSTGRES_DB: hglobal
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker,
      # so the volume mounts the parent directory.
      - pgdata:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hglobal -d hglobal"]
      interval: 2s
      retries: 30

  hg-server:
    build: ../hg-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HG_DATABASE_URL: postgres://hglobal:hglobal_dev@postgres:5432/hglobal?sslmode=disable
      HG_COOKIE_SECURE: "false"
      HG_DEV_ROUTES: "true"
      HG_OWNER_EMAIL: owner@hglobal.test
      HG_OWNER_PASSWORD: owner-password
      HG_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      # Broadcast relay: OBS streams SRT to localhost:9000 with the show's passphrase
      # (GET /studio-api/shows/{id}/ingest). Set HG_YOUTUBE_STREAM_KEY to also push to YouTube.
      HG_RELAY_ENABLED: "true"
      HG_RELAY_PUBLIC_HOST: localhost:9000
      HG_RELAY_SECRET: dev-only-relay-secret-change-me
      HG_YOUTUBE_STREAM_KEY: ${HG_YOUTUBE_STREAM_KEY:-}
    ports:
      - "8080:8080"
      - "9000:9000/udp"
    volumes:
      - storage:/data

volumes:
  pgdata:
  storage:
