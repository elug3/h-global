    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /studio-api/shows/{id}/items/order:
    put:
      tags:
      - studio-live
      summary: 'Reorder preselected items before the show starts. Role: manager or higher.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
                required:
                - items
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - staffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
              - item_ids
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /studio-api/shows/{id}/captures:
