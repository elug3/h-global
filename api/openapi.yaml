            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /studio-api/auth/me:
    get:
      tags:
      - studio-auth
      summary: Current staff member
      responses:
        '200':
          description: OK
          content:
            application/json:
