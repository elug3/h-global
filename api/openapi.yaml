          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - staffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: string
                  format: uuid
              required:
              - product_id
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /studio-api/shows/{id}/items/{item_id}:
    delete:
      tags:
      - studio-live
      summary: 'Remove a preselected item before the show starts. Role: manager or higher.'
      responses:
        '204':
          description: Removed
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
