        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - customerSession: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /api/checkout:
    post:
      tags:
      - checkout
      summary: 'Buy now: hold stock and open a checkout'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Holds the stock until expires_at (10 minutes by default). 409 sold_out when it is gone.
      security:
      - customerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lines:
                  type: array
                  items:
                    type: object
                    properties:
                      variant_id:
                        type: string
                        format: uuid
                      qty:
                        type: integer
                        minimum: 1
                        maximum: 100
                    required:
                    - variant_id
                    - qty
              required:
              - lines
  /api/checkout/{id}:
    get:
      tags:
      - checkout
      summary: My checkout
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - customerSession: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      tags:
      - checkout
      summary: Abandon a checkout and release its holds
      responses:
        '204':
          description: Canceled
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - customerSession: []
  /api/checkout/{id}/shipping:
    put:
      tags:
      - checkout
      summary: Set address and customs code
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 409 checkout_expired once the hold has run out.
      security:
      - customerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Shipping'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /api/checkout/{id}/pay:
    post:
      tags:
      - checkout
      summary: Place the order and start the payment
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayResult'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Card: send the customer to payment.redirect_url. Virtual account: show payment.virtual_account. 502 payment_provider_unavailable;
        retry with /api/orders/{id}/pay.'
      security:
      - customerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum:
                  - card
                  - virtual_account
              required:
              - method
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /hooks/payments/{provider}:
    post:
      tags:
      - hooks
      summary: Payment provider webhook
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Signature-checked by the provider adapter; repeated events are ignored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
    parameters:
    - name: provider
      in: path
      required: true
      schema:
        type: string
  /api/dev/payments/{id}/approve:
    post:
      tags:
      - dev
      summary: 'Development only: approve a fake payment'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Exists only with HG_DEV_ROUTES=true and the fake provider. Sends a signed webhook as the provider would.
      security: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /api/dev/payments/{id}/fail:
    post:
      tags:
      - dev
      summary: 'Development only: decline a fake payment'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /media/{path}:
    get:
      tags:
      - media
      summary: Public media (product photos and product inspection files)
      responses:
        '200':
          description: The file, cacheable for a year
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
    parameters:
    - name: path
      in: path
      required: true
      schema:
        type: string
      description: Object path, may contain slashes.
  /healthz:
    get:
      tags:
      - health
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
components:
  securitySchemes:
    customerSession:
      type: apiKey
      in: cookie
      name: hg_session
    staffSession:
      type: apiKey
      in: cookie
      name: hg_staff_session
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Stable machine code, e.g. sold_out.
        message:
          type: string
        details:
          description: Optional structured details.
      required:
      - error
    Staff:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
          - owner
          - manager
          - cs
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - name
      - role
      - active
      - created_at
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - name
      - created_at
    Login:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
    NewStaff:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
          - owner
          - manager
          - cs
        password:
          type: string
          minLength: 8
          maxLength: 72
      required:
      - email
      - name
      - role
      - password
    StaffPatch:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum:
          - owner
          - manager
          - cs
        active:
          type: boolean
        password:
          type: string
    NewCustomer:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 72
      required:
      - email
      - password
    OptionValue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        hex1:
          type:
          - string
          - 'null'
          description: 'Swatch color #rrggbb.'
        hex2:
          type:
          - string
          - 'null'
          description: Second color for two-tone swatches.
        position:
          type: integer
      required:
      - id
      - label
      - hex1
      - hex2
      - position
    Option:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
        values:
          type: array
          items:
            $ref: '#/components/schemas/OptionValue'
      required:
      - id
      - name
      - position
      - values
    Variant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        option_value_ids:
          type: array
          items:
            type: string
            format: uuid
        label:
          type: string
          description: e.g. 'Brown / Mini'.
        position:
          type: integer
        price_override_won:
          type:
          - integer
          - 'null'
          format: int64
          description: Whole Korean won.
        price_won:
          type: integer
          format: int64
          description: Effective price.
        stock_mode:
          type: string
          enum:
          - counted
          - until_sold_out
        stock_qty:
          type: integer
        held_qty:
          type: integer
        sold_qty:
          type: integer
        available_qty:
          type:
          - integer
          - 'null'
          description: null = unlimited (until_sold_out).
        sold_out:
          type: boolean
        status:
          type: string
          enum:
          - active
          - inactive
        buyable:
          type: boolean
      required:
      - id
      - product_id
      - option_value_ids
      - label
      - position
      - price_override_won
      - price_won
      - stock_mode
      - stock_qty
      - held_qty
      - sold_qty
      - available_qty
      - sold_out
      - status
      - buyable
    Media:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - photo
          - inspection_photo
          - inspection_video
        url:
          type: string
        content_type:
          type: string
        position:
          type: integer
      required:
      - id
      - kind
      - url
      - content_type
      - position
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        price_won:
          type: integer
          format: int64
          description: Whole Korean won.
        status:
          type: string
          enum:
          - draft
          - live
          - hidden
          - archived
        source:
          type: string
          enum:
          - live_capture
          - manual
        specs:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
        details_complete:
          type: boolean
          description: 'False while the title is a placeholder (Live #n) or the description is empty.'
        created_by:
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'
      description: Staff view of a product, with stock bookkeeping.
      required:
      - id
      - title
      - description
      - price_won
      - status
      - source
      - specs
      - tags
      - details_complete
      - created_by
      - created_at
      - updated_at
      - options
      - variants
      - media
    PublicVariant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        option_value_ids:
          type: array
          items:
            type: string
            format: uuid
        price_won:
          type: integer
          format: int64
          description: Whole Korean won.
        available_qty:
          type:
          - integer
          - 'null'
        sold_out:
          type: boolean
        buyable:
          type: boolean
      required:
      - id
      - label
      - option_value_ids
      - price_won
      - available_qty
      - sold_out
      - buyable
    PublicProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        price_won:
          type: integer
          format: int64
          description: Whole Korean won.
        status:
          type: string
          enum:
          - live
          - hidden
        buyable:
          type: boolean
        sold_out:
          type: boolean
        specs:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/PublicVariant'
        photos:
          type: array
          items:
            type: string
            description: URL.
        inspection:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              url:
                type: string
            required:
            - kind
            - url
      description: Storefront view of a product. There is no official (reference) price.
      required:
      - id
      - title
      - description
      - price_won
      - status
      - buyable
      - sold_out
      - specs
      - tags
      - options
      - variants
      - photos
      - inspection
    NewOptionValue:
      type: object
      properties:
        label:
          type: string
          maxLength: 40
        hex1:
          type: string
          description: 'Optional #rrggbb.'
        hex2:
          type: string
          description: Optional; needs hex1.
      required:
      - label
    NewOption:
      type: object
      properties:
        name:
          type: string
          maxLength: 30
        values:
          type: array
          items:
            $ref: '#/components/schemas/NewOptionValue'
      required:
      - name
      - values
    NewStock:
      type: object
      properties:
        mode:
          type: string
          enum:
          - counted
          - until_sold_out
          default: counted
        qty:
          type: integer
          description: Per variant.
          minimum: 0
          maximum: 100000
    NewProduct:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        price_won:
          type: integer
          format: int64
          description: Whole Korean won.
        status:
          type: string
          enum:
          - draft
          - live
          - hidden
          - archived
          default: draft
        specs:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/NewOption'
        stock:
          $ref: '#/components/schemas/NewStock'
      required:
      - title
      - price_won
      description: Every combination of option values becomes a variant (at most 100).
    ProductPatch:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        price_won:
          type: integer
          format: int64
          description: Whole Korean won.
        status:
          type: string
          enum:
          - draft
          - live
          - hidden
          - archived
        specs:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
    VariantPatch:
      type: object
      properties:
        stock_mode:
          type: string
          enum:
          - counted
          - until_sold_out
        stock_qty:
          type: integer
        price_override_won:
          type: integer
          format: int64
          description: Whole Korean won.
        clear_price_override:
          type: boolean
        sold_out:
          type: boolean
        status:
          type: string
          enum:
          - active
          - inactive
    Suggestion:
      type: object
      properties:
        label:
          type: string
        hex1:
          type:
          - string
          - 'null'
        hex2:
          type:
          - string
          - 'null'
        uses:
          type: integer
      required:
      - label
      - hex1
      - hex2
      - uses
    Show:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        youtube_video_id:
          type: string
        status:
          type: string
          enum:
          - draft
          - scheduled
          - live
          - ended
        scheduled_at:
          type:
          - string
          - 'null'
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        display_days_after:
          type: integer
          description: Days items stay on sale after the show ends.
        next_number:
          type: integer
        host_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - title
      - youtube_video_id
      - status
      - scheduled_at
      - started_at
      - ended_at
      - display_days_after
      - next_number
      - host_name
      - created_at
      - updated_at
    NewShow:
      type: object
      properties:
        title:
          type: string
        youtube_url:
          type: string
          description: A video ID or a youtube.com / youtu.be link.
        scheduled_at:
          type: string
          format: date-time
        display_days_after:
          type: integer
          default: 3
        host_name:
          type: string
        status:
          type: string
          enum:
          - draft
          - scheduled
          default: draft
      required:
      - title
    ShowPatch:
      type: object
      properties:
        title:
          type: string
        youtube_url:
          type: string
        scheduled_at:
          type: string
          format: date-time
        display_days_after:
          type: integer
        host_name:
          type: string
        status:
          type: string
          enum:
          - draft
          - scheduled
    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
        show_id:
          type: string
          format: uuid
        number:
          type: integer
          description: Never reused or renumbered once the show is live.
        source:
          type: string
          enum:
          - preselected
          - captured
          - matched
        product_id:
          type: string
          format: uuid
        pinned:
          type: boolean
          description: Worn or held today.
        capture_id:
          type:
          - string
          - 'null'
          format: uuid
        broadcast_offset_sec:
          type:
          - integer
          - 'null'
        keep_listed:
          type: boolean
        hide_at:
          type:
          - string
          - 'null'
          format: date-time
        hidden_at:
          type:
          - string
          - 'null'
          format: date-time
        published_at:
          type: string
          format: date-time
        published_by:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - id
      - show_id
      - number
      - source
      - product_id
      - pinned
      - capture_id
      - broadcast_offset_sec
      - keep_listed
      - hide_at
      - hidden_at
      - published_at
      - published_by
    ItemView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        source:
          type: string
          enum:
          - preselected
          - captured
          - matched
        pinned:
          type: boolean
        is_new:
          type: boolean
          description: Listed on air in the last 15 minutes.
        published_at:
          type: string
          format: date-time
        broadcast_offset_sec:
          type:
          - integer
          - 'null'
        replay_url:
          type: string
          description: youtube.com/watch?v={id}&t={offset}s, or empty.
        product:
          $ref: '#/components/schemas/PublicProduct'
      required:
      - id
      - number
      - source
      - pinned
      - is_new
      - published_at
      - broadcast_offset_sec
      - replay_url
      - product
    StudioItem:
      allOf:
      - $ref: '#/components/schemas/Item'
      - type: object
        properties:
          replay_url:
            type: string
          product:
            $ref: '#/components/schemas/Product'
        required:
        - replay_url
        - product
    ShowView:
      allOf:
      - $ref: '#/components/schemas/Show'
      - type: object
        properties:
          watch_url:
            type: string
          items:
            type: array
            items:
              $ref: '#/components/schemas/ItemView'
          last_event_id:
            type: integer
            description: Open /events from this id to miss nothing.
            format: int64
        required:
        - watch_url
        - items
        - last_event_id
    StudioShow:
      allOf:
      - $ref: '#/components/schemas/Show'
      - type: object
        properties:
          watch_url:
            type: string
          items:
            type: array
            items:
              $ref: '#/components/schemas/StudioItem'
          last_event_id:
            type: integer
            format: int64
        required:
        - watch_url
        - items
        - last_event_id
    Capture:
      type: object
      properties:
        id:
          type: string
          format: uuid
        show_id:
          type: string
          format: uuid
        content_type:
          type: string
        width:
          type: integer
        height:
          type: integer
        broadcast_offset_sec:
          type:
          - integer
          - 'null'
        source:
          type: string
          enum:
          - upload
          - relay
        created_by:
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
        image_url:
          type: string
          description: Staff-only image route.
      required:
      - id
      - show_id
      - content_type
      - width
      - height
      - broadcast_offset_sec
      - source
      - created_by
      - created_at
      - image_url
    Crop:
      type: object
      properties:
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
          minimum: 16
        h:
          type: integer
          minimum: 16
      required:
      - x
      - y
      - w
      - h
    QuickListInput:
      type: object
      properties:
        capture_id:
          type: string
          format: uuid
        crop:
          $ref: '#/components/schemas/Crop'
        product_id:
          type: string
          format: uuid
        title:
          type: string
          description: 'Defaults to ''Live #<number>''.'
        description:
          type: string
        price_won:
          type: integer
          format: int64
          description: Whole Korean won.
        options:
          type: array
          items:
