            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - staffSession: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
        description: Comma-separated statuses.
      - name: q
        in: query
        schema:
          type: string
        description: Title contains.
      - name: incomplete
        in: query
        schema:
          type: boolean
        description: Only products missing details.
      - name: limit
