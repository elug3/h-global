      tags:
      - studio-live
      summary: 'Quick listing: publish an item on air. Role: cs or higher.'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioItem'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'One transaction: product, options, variants, stock, photo, numbered item and the viewer event commit together
        or not at all. 409 show_not_live, already_in_show.'
      security:
      - staffSession: []
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          maxLength: 100
        description: A retry with the same key returns the same item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickListInput'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
