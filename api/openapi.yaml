        type: string
        format: uuid
    patch:
      tags:
      - studio-live
      summary: 'Change a show. Role: manager or higher.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Show'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - staffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowPatch'
  /studio-api/shows/{id}/start:
