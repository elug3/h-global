      tags:
      - studio-live
      summary: 'Capture image. Role: cs or higher.'
      responses:
        '200':
          description: The image
          content:
            image/jpeg: {}
            image/png: {}
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - staffSession: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /studio-api/shows/{id}/items/quick:
