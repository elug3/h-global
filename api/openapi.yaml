          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Stored unchanged (JPEG or PNG). broadcast_offset_sec is set while the show is live.
      security:
      - staffSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /studio-api/captures/{id}:
    get:
      tags:
      - studio-live
      summary: 'Capture details. Role: cs or higher.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - staffSession: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /studio-api/captures/{id}/image:
