# hg-server HTTP API. Generated by api/tools/gen_openapi.py: edit that script, not this file.
openapi: 3.1.0
info:
  title: hg-server API
  version: 0.1.0
  description: 'The HTTP contract between hg-server and its two apps.


    - **/api**: used by storefront. Customer session cookie `hg_session`.

    - **/studio-api**: used by hg-studio (H-Global Studio). Staff session cookie `hg_staff_session`; roles cs < manager <
    owner.

    - **/hooks**: payment provider webhooks.


    Money is whole Korean won (`*_won`). Times are RFC 3339. IDs are UUIDv7. Errors are `{"error": code, "message": text}`
    with 400, 401, 403, 404, 409 or 502. State-changing requests with an `Origin` header outside HG_ALLOWED_ORIGINS get 403
    origin_not_allowed.


    hg-server''s tests fail when a registered route is missing here (internal/app/openapi_test.go).'
servers:
- url: http://localhost:8080
  description: Local hg-server
tags:
- name: auth
- name: catalog
- name: live
- name: checkout
- name: orders
- name: studio-auth
- name: studio-catalog
- name: studio-live
- name: studio-relay
- name: studio-orders
- name: hooks
- name: dev
- name: media
- name: health
paths:
