      security:
      - staffSession: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /studio-api/shows/{id}/end:
    post:
      tags:
      - studio-live
      summary: 'End the show. Role: cs or higher.'
      responses:
        '200':
