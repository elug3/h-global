          content:
            text/event-stream:
              schema:
                type: string
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - staffSession: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
