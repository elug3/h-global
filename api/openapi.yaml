      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffPatch'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /api/auth/register:
    post:
      tags:
