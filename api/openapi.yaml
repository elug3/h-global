        description: Comma-separated.
      - name: limit
        in: query
        schema:
          type: integer
    post:
      tags:
      - studio-live
      summary: 'Create a show. Role: manager or higher.'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Show'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - staffSession: []
      requestBody:
        required: true
